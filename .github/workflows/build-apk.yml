name: Bangun APK

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bangun-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bangun:
    name: Uji dan bangun APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Jalankan unit test
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Siapkan kunci rilis (bila sudah diatur di Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.GASUKOM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gasukom.jks"
            echo "GASUKOM_KEYSTORE_FILE=$RUNNER_TEMP/gasukom.jks" >> "$GITHUB_ENV"
            echo "Memakai kunci rilis dari Secrets."
          else
            echo "Kunci rilis belum diatur; APK ditandatangani dengan kunci debug (khusus uji coba)."
          fi

      - name: Bangun APK
        env:
          GASUKOM_KEYSTORE_PASSWORD: ${{ secrets.GASUKOM_KEYSTORE_PASSWORD }}
          GASUKOM_KEY_ALIAS: ${{ secrets.GASUKOM_KEY_ALIAS }}
          GASUKOM_KEY_PASSWORD: ${{ secrets.GASUKOM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Siapkan berkas APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/gasukom-digital.apk
          ls -la dist

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: gasukom-digital-apk
          path: dist/gasukom-digital.apk
          retention-days: 14

      - name: Perbarui rilis "build-terbaru"
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/catatan-rilis.md "$RUNNER_TEMP/catatan.md"
          printf '\n---\nBuild #%s dari commit %s.\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" >> "$RUNNER_TEMP/catatan.md"
          gh release delete build-terbaru --yes --cleanup-tag || true
          gh release create build-terbaru dist/gasukom-digital.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "GASUKOM Digital: build terbaru (uji coba)" \
            --notes-file "$RUNNER_TEMP/catatan.md"
